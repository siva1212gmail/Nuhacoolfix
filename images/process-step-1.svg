<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="pGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f7ff" />
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#pGrad1)" stroke="#dbeafe" stroke-width="2" />
  
  <!-- Step badge -->
  <rect x="24" y="24" width="70" height="28" rx="14" fill="#0b5ed7" />
  <text x="59" y="43" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">STEP 1</text>
  
  <!-- Icon Center Display -->
  <circle cx="200" cy="140" r="60" fill="#0b5ed7" fill-opacity="0.12" />
  <circle cx="200" cy="140" r="46" fill="#ffffff" filter="url(#pShadow)" />
  <text x="200" y="154" font-size="44" text-anchor="middle">📋</text>
  
  <!-- Title -->
  <text x="200" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#08408f" text-anchor="middle">Doorstep Inspection</text>
  <line x1="160" y1="256" x2="240" y2="256" stroke="#0b5ed7" stroke-width="3" stroke-linecap="round" />
</svg>